[package]
name         = "dev.peios.pnpd-debugsource"
architecture = "x86_64"
description  = "Exact debug sources for the PNP observer service"
# The same crate closure as pnpd; checked by build.main.
license      = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.pnpd-debuginfo" = "= {{release}}"

[files]
"@source:LICENSE"   = "usr/share/licenses/dev.peios.pnpd-debugsource/LICENSE"
":licenses/**"      = "usr/share/licenses/dev.peios.pnpd-debugsource/third-party"
":usr/src/debug/**" = "usr/src/debug"
