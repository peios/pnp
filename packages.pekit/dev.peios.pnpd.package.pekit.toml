# Experimental PNP observer/editor service. The package preserves the current
# SYSTEM identity and port-8081 surface; publication remains blocked on the
# separate product/security decision about privilege and authentication.
side_effects = ["man-db"]

[package]
name        = "dev.peios.pnpd"
description = "Experimental Peios Network Policy observer and editor"
# The crate closure pnpd links; build.main's collect-rust-licences --check
# holds this to what those crates declare.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"



[dependencies]
"dev.peios.libpeios" = ">= 0.5.0"
"org.gnu.glibc"      = "*"
"org.gnu.gcc-libgcc" = "*"

[files]
"@source:LICENSE"                   = "usr/share/licenses/dev.peios.pnpd/LICENSE"
":licenses/**"                      = "usr/share/licenses/dev.peios.pnpd/third-party"
":usr/sbin/pnpd"                    = "usr/sbin/pnpd"
":usr/share/regim/pnpd-service.reg" = "usr/share/regim/pnpd-service.reg"
":usr/share/man/man8/pnpd.8.gz"     = "usr/share/man/man8/pnpd.8.gz"
