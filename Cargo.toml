[workspace]
resolver = "2"
members = ["pnpd"]

[workspace.dependencies]
libc = "0.2"
# The reviewed libpeios-0.5-compatible userspace API. Releases must never
# depend on whichever sibling checkout happens to be present at build time.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f4309f78fbaa878a14429a5e07d778dba9ddfab7", package = "peios" }
