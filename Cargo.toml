[workspace]
resolver = "2"
members = ["pnpd"]

[workspace.dependencies]
libc = "0.2"
# The reviewed libpeios-0.5-compatible userspace API. Releases must never
# depend on whichever sibling checkout happens to be present at build time.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", package = "peios" }
