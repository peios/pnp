# PNPd owns the hermetic build, production validation, split debug payloads,
# and corresponding source for the PNP viewer service. Network access is
# confined to build.vendor. The current privileged, unauthenticated TCP
# architecture is deliberately confined to the Experimental development image;
# it is not approved for a future production profile without a separate design.

out_dir = "out"

[source_package]
name = "dev.peios.pnpd-source"

[build.vendor]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"

PEIOS_RS_REV=f4309f78fbaa878a14429a5e07d778dba9ddfab7
grep -F "peios-rs.git?rev=$PEIOS_RS_REV#$PEIOS_RS_REV" Cargo.lock >/dev/null
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
cp "$PEKIT_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

# Cargo does not vendor path dependencies. Reject any mutable dependency
# outside this release source tree before the network boundary closes.
SRC=$(pwd -P)
export SRC
cargo metadata --locked --offline --format-version 1 |
  python3 -c '
import json, os, pathlib, sys
metadata = json.load(sys.stdin)
root = pathlib.Path(os.environ["SRC"]).resolve()
members = set(metadata["workspace_members"])
external = []
for package in metadata["packages"]:
    if package["id"] in members or package.get("source") is not None:
        continue
    manifest = pathlib.Path(package["manifest_path"]).resolve()
    try:
        manifest.relative_to(root)
    except ValueError:
        external.append(str(manifest))
if external:
    raise SystemExit("pnpd: mutable external Cargo dependencies:\n  " + "\n  ".join(sorted(external)))
'
'''

[build.vendor.dependencies.peipkg]
"dev.peios.build-essentials-rust" = "= 1.0.0-1"
"org.mozilla.ca-certificates"     = "*"
"org.python.python3"              = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
DEBUG_PREFIX=/usr/src/debug/dev.peios.pnpd-$PEKIT_VERSION
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
LICENSE_ROOT=$PEKIT_OUT/licenses
export CARGO_HOME=$PEKIT_OUT/cargo-home
export CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc pkg-config python3 find sort cmp grep sed gzip readelf objcopy strip debugedit; do
  command -v "$tool" >/dev/null || {
    echo "pnpd: missing required build tool: $tool" >&2
    exit 1
  }
done

unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
. "$SRC/packaging/check-libpeios.sh"
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if expected != "0.0.0-localdev" and versions != [expected]:
    raise SystemExit(f"pnpd: workspace versions {versions!r} do not equal package version {expected!r}")
'

export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings --remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"
# Control-flow protection (PEI-1155). Peios' libstd is built with LLVM's CET
# instrumentation (org.rust-lang.rust); stable rustc applies it to other
# crates only under -Zcf-protection, so every crate here gets ENDBR landing
# pads and the IBT/SHSTK property survives the link. The bootstrap escape
# hatch is the one the Rust recipe itself uses for the same flag.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"

for target in target-a target-b; do
  CARGO_PROFILE_RELEASE_DEBUG=2 CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off \
    cargo build --release --workspace --locked --offline \
      --target-dir "$PEKIT_OUT/$target"
done
cmp "$PEKIT_OUT/target-a/release/pnpd" "$PEKIT_OUT/target-b/release/pnpd"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/share/regim" \
         "$PEKIT_OUT/usr/share/man/man8"
install -m 0755 "$PEKIT_OUT/target-a/release/pnpd" "$PEKIT_OUT/usr/sbin/pnpd"
install -m 0644 "$SRC/registry.d/pnpd-service.reg" "$PEKIT_OUT/usr/share/regim/pnpd-service.reg"
gzip -9n < "$SRC/man/pnpd.8" > "$PEKIT_OUT/usr/share/man/man8/pnpd.8.gz"

# Ship the notices of every crate pnpd links and hold each package
# definition to the conjunction of their licences (PEI-1163). peios-rs
# carries no package-local notice; ship the reviewed notice of that same
# pinned source.
for definition in dev.peios.pnpd dev.peios.pnpd-debuginfo dev.peios.pnpd-debugsource; do
  /usr/libexec/peios-packaging/collect-rust-licences \
    --licence-root "$LICENSE_ROOT" --root pnpd \
    --notice "git+https://github.com/peios/peios-rs.git=third-party/peios-rs-LICENSE" \
    --check "packages.pekit/$definition.package.pekit.toml"
done
test -s "$LICENSE_ROOT/crate-licenses.tsv"

# The debug split stays local rather than using
# /usr/libexec/peios-packaging/split-debug: the vendored crates' sources
# live in $PEKIT_VENDOR_OUT, outside any single build root split-debug
# copies sources from; the loop below resolves them there.

debug_list=$PEKIT_OUT/.debug-pnpd
elf=$PEKIT_OUT/usr/sbin/pnpd
debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$debug_list" -n "$elf"
build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p')
test -n "$build_id"
first=$(printf %s "$build_id" | cut -c1-2)
rest=$(printf %s "$build_id" | cut -c3-)
debug=$PEKIT_OUT/debug/pnpd/usr/lib/debug/.build-id/$first/$rest.debug
mkdir -p "$(dirname "$debug")" "$DEBUG_ROOT"
objcopy --only-keep-debug "$elf" "$debug"
strip --strip-unneeded "$elf"
objcopy --add-gnu-debuglink="$debug" "$elf"

tr '\0' '\n' < "$debug_list" | LC_ALL=C sort -u |
while IFS= read -r source; do
  test -n "$source" || continue
  case "$source" in */) continue ;; esac
  case "$source" in
    "$DEBUG_PREFIX"/vendor/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$PEKIT_VENDOR_OUT/$relative
      ;;
    "$DEBUG_PREFIX"/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$SRC/$relative
      ;;
    vendor/*)
      relative=$source
      origin=$PEKIT_VENDOR_OUT/$source
      ;;
    *)
      relative=$source
      origin=$SRC/$source
      ;;
  esac
  test -f "$origin" || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$relative")"
  cp "$origin" "$DEBUG_ROOT/$relative"
done
rm -f "$debug_list"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[build.main.dependencies.peipkg]
"dev.peios.build-essentials-rust" = "= 1.0.0-1"
"org.gnu.gzip"                    = "*"
"org.python.python3"              = "*"
"org.llvm.clang-devel"            = ">= 22.1.8"
"org.pkgconf.pkgconf"             = "*"
"dev.peios.libpeios-devel"        = ">= 0.5.0"
"dev.peios.packaging-tools"       = "*"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
. packaging/check-libpeios.sh
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings"
# Control-flow protection (PEI-1155): test code is instrumented like build.main.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"
cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/tests"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
elf="$PEKIT_OUT/usr/sbin/pnpd"
build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p')
first=$(printf %s "$build_id" | cut -c1-2)
rest=$(printf %s "$build_id" | cut -c3-)
debug="$PEKIT_OUT/debug/pnpd/usr/lib/debug/.build-id/$first/$rest.debug"
# Installed payload checks inventory the existing Experimental service; they
# deliberately do not endorse its pending security architecture.
set +e
"$elf" --help > "$PEKIT_OUT/pnpd-help" 2>&1
help_status=$?
set -e
test "$help_status" = 2
grep -Fx 'usage: pnpd [--port N] [--ring N]' "$PEKIT_OUT/pnpd-help" >/dev/null
rm -f "$PEKIT_OUT/pnpd-help"
gzip -t "$PEKIT_OUT/usr/share/man/man8/pnpd.8.gz"
grep -aF '<b>PNP</b>' "$elf" >/dev/null
grep -aF '/api/policy/set' "$elf" >/dev/null

python3 - "$PEKIT_OUT" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
service = json.loads((root / "usr/share/regim/pnpd-service.reg").read_text())
values = {
    value["name"]: value["data"]
    for key in service["keys"]
    if key["path"] == r"Machine\System\Services\pnpd"
    for value in key["values"]
}
assert values["ImagePath"] == "/usr/sbin/pnpd"
assert values["Identity"] == "SYSTEM"
assert values["Readiness"] == 0
assert values["RestartPolicy"] == 2
assert values["ErrorControl"] == 0
PY

readelf -h "$elf" | grep -E 'Type:[[:space:]]+DYN' >/dev/null
readelf -lW "$elf" | grep 'GNU_RELRO' >/dev/null
readelf -lW "$elf" | grep -E 'GNU_STACK[[:space:]].*RW[[:space:]]' >/dev/null
if readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RWE'; then
  echo "pnpd: executable stack" >&2
  exit 1
fi
readelf -dW "$elf" | grep 'BIND_NOW' >/dev/null
readelf -dW "$elf" | grep 'RELR' >/dev/null
readelf -dW "$elf" | grep -E 'FLAGS_1.*PIE' >/dev/null
readelf -dW "$elf" | grep -F 'Shared library: [libpeios.so.0]' >/dev/null
readelf -dW "$elf" | grep -F 'Shared library: [libgcc_s.so.1]' >/dev/null
readelf -dW "$elf" | grep -F 'Shared library: [libc.so.6]' >/dev/null
if readelf -dW "$elf" | grep -Eq '(RPATH|RUNPATH|TEXTREL)'; then
  echo "pnpd: forbidden dynamic tag" >&2
  exit 1
fi
if readelf -SW "$elf" | grep -q '\.debug_info'; then
  echo "pnpd: unsplit debug information" >&2
  exit 1
fi
test -s "$debug"
readelf -SW "$debug" | grep '\.debug_info' >/dev/null
debug_build_id=$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p')
test "$debug_build_id" = "$build_id"
for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
  if grep -aqF "$forbidden" "$elf" "$debug"; then
    echo "pnpd: build path leaked into payload: $forbidden" >&2
    exit 1
  fi
done
'''

[test.dependencies.peipkg]
"dev.peios.build-essentials-rust" = "= 1.0.0-1"
"org.gnu.gzip"                    = "*"
"org.python.python3"              = "*"
"org.llvm.clang-devel"            = ">= 22.1.8"
"org.pkgconf.pkgconf"             = "*"
"dev.peios.libpeios-devel"        = ">= 0.5.0"
